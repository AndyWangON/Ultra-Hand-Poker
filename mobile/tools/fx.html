<!doctype html><body style="margin:0;background:transparent"><canvas id="c"></canvas><script>
const m=location.hash.slice(1),c=document.getElementById('c'),x=c.getContext('2d');
const S={spark:64,star:96,coin:72,ring:256,rays:512,smoke:128}[m];c.width=c.height=S;const h=S/2;
if(m==='spark'){const g=x.createRadialGradient(h,h,0,h,h,h);g.addColorStop(0,'rgba(255,255,240,1)');g.addColorStop(.2,'rgba(255,230,150,.9)');g.addColorStop(.5,'rgba(255,170,60,.3)');g.addColorStop(1,'rgba(255,140,40,0)');x.fillStyle=g;x.fillRect(0,0,S,S)}
if(m==='star'){x.translate(h,h);for(const [len,w,a] of [[h,5,0],[h*.62,3.5,Math.PI/4]]){for(let r=0;r<4;r++){x.save();x.rotate(a+r*Math.PI/2);const g=x.createLinearGradient(0,0,len,0);g.addColorStop(0,'rgba(255,250,220,1)');g.addColorStop(1,'rgba(255,210,120,0)');x.fillStyle=g;x.beginPath();x.moveTo(0,-w);x.lineTo(len,0);x.lineTo(0,w);x.fill();x.restore()}}const g=x.createRadialGradient(0,0,0,0,0,h*.4);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,220,140,0)');x.fillStyle=g;x.fillRect(-h,-h,S,S)}
if(m==='coin'){x.translate(h,h);let g=x.createLinearGradient(-h,-h,h,h);g.addColorStop(0,'#fff1b0');g.addColorStop(.5,'#e3a72f');g.addColorStop(1,'#8a5a12');x.fillStyle=g;x.beginPath();x.arc(0,0,h-2,0,7);x.fill();x.strokeStyle='#7a4c0c';x.lineWidth=2;x.stroke();x.strokeStyle='#ffe7a0';x.lineWidth=2;x.beginPath();x.arc(0,0,h*.72,0,7);x.stroke();x.fillStyle='#8a5a12';x.font=`900 ${h}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('♠',0,2);x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(-h*.3,-h*.35,h*.25,h*.12,-.6,0,7);x.fill()}
if(m==='ring'){x.translate(h,h);const g=x.createRadialGradient(0,0,h*.6,0,0,h);g.addColorStop(0,'rgba(255,220,140,0)');g.addColorStop(.84,'rgba(255,220,140,0)');g.addColorStop(.92,'rgba(255,240,190,.95)');g.addColorStop(.95,'rgba(255,255,235,1)');g.addColorStop(1,'rgba(255,200,100,0)');x.fillStyle=g;x.fillRect(-h,-h,S,S)}
if(m==='rays'){x.translate(h,h);for(let i=0;i<18;i++){x.save();x.rotate(i*Math.PI*2/18);const g=x.createLinearGradient(0,0,h,0);g.addColorStop(0,'rgba(255,230,150,.9)');g.addColorStop(1,'rgba(255,200,90,0)');x.fillStyle=g;x.beginPath();x.moveTo(0,0);x.lineTo(h,-h*.09);x.lineTo(h,h*.09);x.fill();x.restore()}}
if(m==='smoke'){const g=x.createRadialGradient(h,h,0,h,h,h);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,S,S)}
</script>
