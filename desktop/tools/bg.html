<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Procedural casino lounge background for Ultra Hand Poker
const MODE = location.hash.slice(1) || 'room';
const cv = document.getElementById('c'); let x = cv.getContext('2d');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

function layer(blur, fn) { const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const prev = x; x = oc.getContext('2d'); fn(); x = prev; x.save(); x.filter = `blur(${blur}px)`; x.drawImage(oc, 0, 0); x.restore(); }
function glow(cx, cy, r, col, a = 1) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col.replace('A', a)); g.addColorStop(1, col.replace('A', 0)); x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2); }
function room() {
  // base
  let g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1e0b07'); g.addColorStop(.55, '#140705'); g.addColorStop(1, '#070303'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // back wall wood paneling
  layer(2, () => {
  for (let i = 0; i < 16; i++) {
    const px = i * 128 - 20, py = 140, pw = 112, ph = 420;

    x.strokeStyle = 'rgba(0,0,0,.5)'; x.lineWidth = 6; x.strokeRect(px, py, pw, ph);

  });
  // stained glass windows (left) & bar shelves (right)
  layer(5, () => {
  [[150, 160], [1765, 150]].forEach(([wx, wy]) => {
    x.fillStyle = '#0b0610'; x.beginPath(); x.moveTo(wx, wy + 200); x.lineTo(wx, wy + 40); x.arc(wx + 50, wy + 40, 50, Math.PI, 0); x.lineTo(wx + 100, wy + 200); x.fill();

  });

  for (let row = 0; row < 3; row++) {

    for (let px = x0; px < x1; px++) {

      const gg = x.createLinearGradient(0, y0, 0, bottom);
      const r = Math.round(150 * v), gc = Math.round(14 * v), b = Math.round(22 * v);
      gg.addColorStop(0, `rgb(${r * .45 | 0},${gc * .4 | 0},${b * .4 | 0})`); gg.addColorStop(.25, `rgb(${r},${gc},${b})`); gg.addColorStop(.85, `rgb(${r * .85 | 0},${gc},${b})`); gg.addColorStop(1, `rgb(${r * .35 | 0},${gc * .3 | 0},${b * .3 | 0})`);

  }
  layer(1.2, () => {
  curtain(470, 880, 0, 470, 0, true); curtain(1040, 1450, 0, 470, 2, true);
  curtain(0, 135, 0, 760, 1, false); curtain(1785, 1920, 0, 760, 3, false);

  });
  // warm light pooling on curtains
  glow(675, 230, 260, 'rgba(255,120,80,A)', .18); glow(1245, 230, 260, 'rgba(255,120,80,A)', .18);
  // chandeliers
  function chandelier(cx, cy, s, blur) {
    glow(cx, cy + 50 * s, 340 * s, 'rgba(255,196,110,A)', .7);
    layer(blur, () => {
    x.strokeStyle = '#d8a548'; x.lineWidth = 3 * s; x.beginPath(); x.moveTo(cx, cy - 300); x.lineTo(cx, cy + 120 * s); x.stroke();
    // central body

    x.fillStyle = bg; x.beginPath(); x.ellipse(cx, cy + 40 * s, 12 * s, 40 * s, 0, 0, 7); x.fill();
    x.beginPath(); x.ellipse(cx, cy + 128 * s, 8 * s, 16 * s, 0, 0, 7); x.fill();
    for (let t = 0; t < 3; t++) {
      const ty = cy + t * 38 * s, rw = (60 + t * 48) * s, rh = rw * .26;
      x.lineWidth = 2.4 * s; x.strokeStyle = 'rgba(216,165,72,.55)'; x.beginPath(); x.ellipse(cx, ty, rw, rh, 0, Math.PI, 2 * Math.PI); x.stroke();
      x.strokeStyle = '#e6b456'; x.beginPath(); x.ellipse(cx, ty, rw, rh, 0, 0, Math.PI); x.stroke();
      const n = 6 + t * 3;
      for (let i = 0; i < n; i++) {
        const a = 2 * Math.PI * i / n, px = cx + Math.cos(a) * rw, py = ty + Math.sin(a) * rh, front = Math.sin(a) > -0.2;
        // crystal swag to next candle
        const a2 = 2 * Math.PI * (i + 1) / n, qx = cx + Math.cos(a2) * rw, qy = ty + Math.sin(a2) * rh;
        for (let k = 1; k < 6; k++) { const u = k / 6, sx = px + (qx - px) * u, sy = py + (qy - py) * u + Math.sin(u * Math.PI) * 16 * s; x.fillStyle = `rgba(255,248,230,${front ? .85 : .35})`; x.beginPath(); x.arc(sx, sy, 1.8 * s, 0, 7); x.fill(); }
        for (let d = 0; d < 3; d++) { x.fillStyle = `rgba(255,250,235,${(front ? .9 : .4) - d * .2})`; x.beginPath(); x.arc(px, py + (8 + d * 9) * s, (2.6 - d * .5) * s, 0, 7); x.fill(); }
        x.fillStyle = '#f6eedc'; x.fillRect(px - 2 * s, py - 16 * s, 4 * s, 14 * s);
        x.fillStyle = '#fff6d8'; x.beginPath(); x.arc(px, py - 19 * s, 3.6 * s, 0, 7); x.fill();
      }
    }
    });
    x.save(); x.globalCompositeOperation = 'lighter';
    for (let t = 0; t < 3; t++) { const ty = cy + t * 38 * s, rw = (60 + t * 48) * s, rh = rw * .26, n = 6 + t * 3; for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n; glow(cx + Math.cos(a) * rw, ty + Math.sin(a) * rh - 19 * s, 26 * s, 'rgba(255,214,140,A)', .55); } }
    x.restore();
  }
  chandelier(290, -10, 1.05, 1.2); chandelier(1650, 20, .95, 1.6); chandelier(660, 110, .5, 2.6); chandelier(1290, 110, .5, 2.6);
  // red-shade table lamp (left)
  layer(1.5, () => {
  glow(150, 330, 260, 'rgba(255,90,60,A)', .5);
  x.fillStyle = '#7a5418'; x.fillRect(140, 400, 18, 140); x.beginPath(); x.ellipse(149, 545, 60, 14, 0, 0, 7); x.fill();
  let lg = x.createLinearGradient(40, 0, 260, 0); lg.addColorStop(0, '#6a0a10'); lg.addColorStop(.45, '#ff5a3a'); lg.addColorStop(.7, '#d3202a'); lg.addColorStop(1, '#5a0710');
  x.fillStyle = lg; x.beginPath(); x.moveTo(90, 250); x.lineTo(210, 250); x.lineTo(262, 405); x.lineTo(36, 405); x.closePath(); x.fill();
  x.strokeStyle = '#e8b04a'; x.lineWidth = 4; x.beginPath(); x.moveTo(36, 405); x.lineTo(262, 405); x.stroke(); x.beginPath(); x.moveTo(90, 250); x.lineTo(210, 250); x.stroke();
  glow(150, 420, 120, 'rgba(255,200,120,A)', .55);
  });
  // velvet armchairs & lounge silhouettes
  layer(6, () => {
  [[30, 600, 220], [1700, 560, 240], [380, 610, 130], [1450, 600, 140]].forEach(([ax, ay, aw]) => {
    const gg = x.createLinearGradient(0, ay, 0, ay + aw); gg.addColorStop(0, '#7a0e18'); gg.addColorStop(1, '#2a0408');
    x.fillStyle = gg; x.beginPath(); x.roundRect(ax, ay, aw, aw * .8, aw * .18); x.fill();
    x.fillStyle = 'rgba(255,140,120,.16)'; x.beginPath(); x.roundRect(ax + aw * .12, ay + 8, aw * .76, aw * .2, 20); x.fill();
  });
  });
  // bokeh
  x.save(); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 90; i++) {
    const bx = rnd() * W, by = rnd() * 640, br = 4 + rnd() * 22, a = .05 + rnd() * .16;
    x.filter = `blur(${2 + rnd() * 5}px)`; x.fillStyle = `rgba(255,${170 + rnd() * 60 | 0},${90 + rnd() * 60 | 0},${a})`; x.beginPath(); x.arc(bx, by, br, 0, 7); x.fill();
  }

  g = x.createLinearGradient(0, 600, 0, H); g.addColorStop(0, 'rgba(10,4,3,0)'); g.addColorStop(.4, 'rgba(10,4,3,.85)'); g.addColorStop(1, '#050202'); x.fillStyle = g; x.fillRect(0, 600, W, H - 600);
  // vignette

}
function table() {
  const cx = 980, cy = 975, rx = 1030, ry = 572;
  // drop shadow
  layer(30, () => { x.fillStyle = 'rgba(0,0,0,.8)'; x.beginPath(); x.ellipse(cx, cy + 20, rx + 30, ry + 30, 0, 0, 7); x.fill(); });
  // outer wood rim

  const ring = (dr, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.ellipse(cx, cy, rx - dr, ry - dr, 0, 0, 7); x.stroke(); };
  const gold = x.createLinearGradient(cx - rx, 0, cx + rx, 0); gold.addColorStop(0, '#6d4511'); gold.addColorStop(.25, '#f2c76a'); gold.addColorStop(.5, '#b07a22'); gold.addColorStop(.75, '#ffe08a'); gold.addColorStop(1, '#6d4511');
  ring(4, 5, gold);
  // polished wood rail with gold inlays
  const rail = (dr, w) => { x.lineWidth = w; x.beginPath(); x.ellipse(cx, cy, rx - dr, ry - dr, 0, 0, 7); x.stroke(); };
  g = x.createLinearGradient(0, cy - ry, 0, cy + 200); g.addColorStop(0, '#7a3a14'); g.addColorStop(.25, '#4a1e0a'); g.addColorStop(.6, '#2a0f05'); g.addColorStop(1, '#5a2a10');
  x.strokeStyle = g; rail(38, 62);
  x.strokeStyle = 'rgba(255,214,150,.35)'; x.lineWidth = 3; x.beginPath(); x.ellipse(cx, cy, rx - 26, ry - 26, 0, Math.PI * 1.02, Math.PI * 1.98); x.stroke();
  x.strokeStyle = 'rgba(255,190,120,.18)'; x.lineWidth = 10; x.beginPath(); x.ellipse(cx, cy, rx - 40, ry - 40, 0, Math.PI * .02, Math.PI * .4); x.stroke(); x.beginPath(); x.ellipse(cx, cy, rx - 40, ry - 40, 0, Math.PI * .6, Math.PI * .98); x.stroke();
  ring(70, 5, gold); ring(76, 1.5, 'rgba(255,230,160,.6)');

  const frx = rx - 78, fry = ry - 78;
  g = x.createRadialGradient(cx, cy - fry * .62, 40, cx, cy - fry * .2, frx * .9);
  g.addColorStop(0, '#2a7a43'); g.addColorStop(.35, '#185c30'); g.addColorStop(.7, '#0c3c1f'); g.addColorStop(1, '#051f10');
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, frx, fry, 0, 0, 7); x.fill();

  x.putImageData(id, 0, 0);
  // inner decorative line
  x.setLineDash([]); x.strokeStyle = 'rgba(232,190,100,.28)'; x.lineWidth = 2; x.beginPath(); x.ellipse(cx, cy, frx - 46, fry - 46, 0, 0, 7); x.stroke();
  x.strokeStyle = 'rgba(232,190,100,.14)'; x.lineWidth = 1; x.beginPath(); x.ellipse(cx, cy, frx - 54, fry - 54, 0, 0, 7); x.stroke();

  x.save(); x.beginPath(); x.ellipse(cx, cy, frx, fry, 0, 0, 7); x.clip();
  x.lineWidth = 60; x.strokeStyle = 'rgba(0,0,0,.35)'; x.filter = 'blur(18px)'; x.beginPath(); x.ellipse(cx, cy, frx + 10, fry + 10, 0, 0, 7); x.stroke(); x.restore();

}
